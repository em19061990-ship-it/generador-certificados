name: Mantener Streamlit Despierto

on:
  schedule:
    # Se ejecuta cada 12 horas (mediodía y medianoche)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Actualizar log de actividad
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Crea o actualiza un archivo con la fecha actual
          echo "Último pulso: $(date)" > actividad.txt
          git add actividad.txt
          git commit -m "Pulso de actividad: $(date)"
          git push
